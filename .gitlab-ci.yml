include: 'https://gitlab.gnome.org/GNOME/citemplates/raw/master/flatpak/flatpak_ci_initiative.yml'

variables:
    BUNDLE: "hydrapaper.flatpak"

test:
    image: python:3.8
    script:
        - pip install pyflakes
        - pyflakes hydrapaper

